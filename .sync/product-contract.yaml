  - id: HC-ANALYZE-002
    area: "media-analysis"
    title: "무음·무트랙 영상의 화면 움직임 분석과 중앙 fallback (Ai 0.3.0)"
    user_outcome: "소리가 없는 영상도 화면 움직임으로 하이라이트를 찾고, 변화가 적으면 중앙 구간을 정직하게 제안한다."
    invariants:
      - "무음 판정: 오디오 트랙 없음(noTrack) 또는 maxPeak<0.0032 그리고 maxRMS<0.0016(silent)."
      - "영상 프레임을 160×90 BGRA로 읽어 8×8 격자(셀당 4점 샘플) 밝기 요약. 샘플 간격 max(0.2초, duration/1200)."
      - "localMotion = median×0.9 차감 잔차 상위 1/4 평균. 컷 경계(widespread>0.72 & mean>0.14)와 플래시(밝기변화>0.22 & widespread>0.55), localMotion<0.0035는 점수 0."
      - "baseline EMA 0.94/0.06(샘플 상한 max(0.006, baseline×1.5)). 점수 = min(1, max(0,contrast−1)×0.28 + min(1, localMotion×8)×0.72)."
      - "3점 평활(0.22/0.56/0.22), 가장자리 min(max(0.5초, 5%), duration/3) 구간 0 처리. 최대 평활 점수 <0.12면 가짜 피크를 만들지 않고 중앙 fallback."
      - "후보: 값≥0.28인 국소 최대, 최소 간격 max(0.75초, duration/20), 상한 12."
      - "highlightSource 표시 문구: audio='소리 분석', visualMotion='화면 움직임 분석', fallback='화면 변화 적음 · 중앙 선택'."
