  - id: HC-AISHOT-005
    area: "aishot"
    title: "AiShot 화면 격자 움직임 분석과 스윙 모션 상태기계 (Ai 0.4.0)"
    user_outcome: "정지(주소) 뒤 백스윙→다운스윙 화면 움직임이 있을 때만 충격음이 촬영으로 이어진다."
    invariants:
      - "시각 분석 주기 0.10초, 8×8 격자 중심점 밝기(수식은 소스 그대로). 줌·카메라 전환·회전 시 분석 리셋."
      - "보조 시각 점수: rawEnergy=motion×2.6+brightness×1.4, baseline EMA 0.92/0.08(상한 max(0.015, ×1.45)), score=min(1, max(0,contrast−1)×0.28+min(1,motion×4)×0.48+min(1,bc×3)×0.24). 유효 시한 0.75초."
      - "스윙 샘플: globalComponent=격자차 median; 잔차=max(0, d−global×0.65); widespread=차이≥max(0.025, global×1.8) 셀 비율; 3개 좌/중/우 영역(열 0-3/2-5/4-7, 행 1-6) 중 잔차 상위 10 평균×4 최대 영역이 localMotion·dominantRegion; concentration=상위16 잔차/전체."
      - "전역 변화(global≥0.16 또는 widespread≥0.68 또는 밝기변화≥0.14)가 2회 연속이면 상태기계 리셋. 발생 시각은 무음 퍼팅의 장면 안정성 판정에 사용."
      - "상태기계 seekingAddress→addressed: local≤0.075 & global≤0.08 & widespread≤0.32가 0.55초 지속."
      - "addressed→backswing: local≥0.12 & concentration≥0.38 & widespread 0.04~0.58 후보가 0.35초 내 2회, dominantRegion 이탈(±1 초과) 없이. local≤0.085면 후보 리셋."
      - "backswing→downswing: 경과≥0.18초 & 샘플≥3 & local≥0.20 & (가속≥0.035 또는 local≥max(0.26, 직전peak×1.15)). 경과>1.8초 또는 영역 이탈(±1 초과 & local≥0.18)이면 리셋."
      - "downswing 임팩트 창 0.42초. confidence = max(0.72, min(1, 0.62+backswingPeak×0.95))."
