  - id: HC-AISHOT-007
    area: "aishot"
    title: "AiShot 트리거 융합 정책 (소리+화면+자세, ready 억제 창)"
    user_outcome: "충격음·화면 움직임·자세 근거가 시간 정렬로 맞을 때만 자동 촬영되고, 준비 안내 직후에는 강한 물리 임팩트만 통과한다."
    invariants:
      - "모델 v0.4.0 이상은 융합 경로: 오디오 판정 통과가 항상 필수(무음 퍼팅 제외)."
      - "보류 임팩트(pendingImpact)는 0.65초 보존. 재평가 시점: 즉시(오디오), 시각 프레임(임팩트 창 진입 후 0.20초 이내), 자세 결과 도착(0.65초 이내), 자세 미검출 복귀(0.42초 이내)."
      - "최근 시각 프레임(0.35초 이내)이 있으면: 모션 임팩트 창(conf≥0.72, 정렬 −0.20~+0.32초) 또는 [0.5.1+] 자세 임팩트 창(conf≥0.72, 임팩트 시각이 창 내) 중 하나가 필요."
      - "최근 시각 프레임이 없으면 소리 단독 안전망 — 단 ready 억제 창 안이면 불가."
      - "자세가 신선(0.35초 이내)하고 관측 conf≥0.72이며 seekingAddress가 아니면 자세 확인이 추가 필수(requiresPoseConfirmation)."
      - "ready 억제 창: ready 안내 직후 1.05초. 이 안에서는 peak≥0.16 & impactScore≥0.08의 강한 임팩트만 통과."
      - "v0.4.0 미만(구버전 롤백 시): 시각 보조 경로 — visualScore≥0.62 & confidence+visual×0.32≥0.96 & score≥max(0.04, baseline×1.45), 억제 창 내에는 visual≥0.5 & score≥max(0.16, baseline×2.4) & peak≥0.25의 명백한 물리 임팩트만."
      - "수동 촬영 버튼은 융합과 무관하게 ready 이후 항상 가능(트리거 시각=현재 경과)."
      - "카메라 전환 대기·인터럽션 복구·분석 중단 중에는 자동 트리거 금지."
    states: "pending 대기/재평가/트리거 확정/폐기(0.65초 초과)"
    errors: "해당 없음"
    cancellation: "suspendAutomaticAnalysis로 pending 폐기"
    data_contract: "해당 없음"
    permissions_security: "해당 없음"
    gestures: "수동 촬영 버튼(라벨 '수동 촬영', 힌트 '현재 순간을 직접 촬영해 클립으로 저장합니다')"
    accessibility: "위 버튼 라벨·값(현재 phase 제목)"
    device_adaptation: "없음(정책 상수 불변)"
    ios_evidence:
      - "HanClip/Services/AudioImpactClassifier.swift:789-822 (GolfSwingFusionPolicy)"
      - "HanClip/Services/AiShotCamera.swift:2646-2690 (구버전 경로·pending 생성), 3137-3202 (attemptAutomaticTrigger), 2275-2289 (수동), 1935 (억제 1.05초)"
    android_acceptance: "정렬 창(−0.20/+0.32), 0.65/0.35/0.20/0.42초 시한, 억제 창 예외 조건이 값 단위로 일치."
    verification: "타이밍 로그 fixture 재생으로 트리거 유무 비교."
  - id: HC-AISHOT-008
    area: "aishot"
    title: "무음 퍼팅 안전망 (Ai 0.6.0)"
    user_outcome: "타구음이 거의 없는 퍼팅도 준비→작은 백스윙→전진 스트로크→짧은 팔로스루가 순서대로 확인되면 소리 없이 자동 촬영된다."
    invariants:
      - "v0.6.0(supportsSoundlessPuttFallback)에서만 활성."
      - "퍼팅 상태기계: 정지(손속도≤0.25·몸통≤0.20, 0.60초·3샘플)→주소; 변위≥0.06→백스윙; peak 0.12~0.60(초과 시 리셋=아이언 반례 상한), 경과≤2.0초; 복귀속도>1.5로 주소 통과 시 리셋(스윙으로 간주); 경과≥0.15 & 2샘플 & peak≥0.12 & 복귀속도≥0.20 & 주소 통과(진행≤max(0.04, peak×0.30))→전진 스트로크; 0.9초 내 팔로스루 진행≤−max(0.025, peak×0.15) 2샘플→확정. 팔로스루 과대(≤−max(0.30, peak×1.2))·미달 시 리셋."
      - "확정 confidence = min(시퀀스 최저 관측 conf, min(1, 0.62+peak×0.9))."
      - "몸통 속도>0.9(정규화)면 걷기·이동으로 보고 리셋."
      - "발동 조건 전부 필요: 스트로크 확정 & 스트로크 conf≥0.72 & 자세 관측 conf≥0.72 & 최근 자세≤0.35초 & 최근 시각 프레임≤0.35초 & 장면 안정(최근 전역 변화 후 1.0초 경과) & ready 억제 창 밖 & ready 안내 후 & 미트리거 상태."
      - "확정 후 2.0초 재발동 금지(한 스트로크 중복 방지). 트리거 시각 = min(현재, max(0, strokeTime))."
      - "일반 스윙의 충격음+시각 결합(HC-AISHOT-007)은 그대로 유지."
      - "정직한 한계: 학습 샘플이 풀스윙 중심이라 퍼팅 정확도는 미검증 — 안전망 설계 상태임을 유지·문서화."
    states: "seekingAddress/addressed/backswing/forwardStroke/confirmedStroke + 2초 refractory"
    errors: "해당 없음"
    cancellation: "리셋 조건 다수(위 invariants)"
    data_contract: "해당 없음"
    permissions_security: "기기 내 처리"
    gestures: "해당 없음"
    accessibility: "해당 없음"
    device_adaptation: "없음(상수 불변). 롤백은 모델 버전 교체로."
    ios_evidence:
      - "HanClip/Services/AudioImpactClassifier.swift:481-787 (GolfPuttStrokeAnalyzer·GolfPuttFusionPolicy), 824-927 (버전 플래그)"
      - "HanClip/Services/AiShotCamera.swift:3204-3235 (attemptSoundlessPuttTrigger)"
      - "REF-AILEARN 0.6.0, docs/ai-learning/aishot-screen-golf-iron-study-2026-08-24.json (아이언 반례)"
    android_acceptance: "주소로 서 있기만/왜글/걷기/카메라 이동/말소리에서 미발동, 유효 퍼팅 시퀀스에서 발동, 2초 중복 방지가 재현."
    verification: "퍼팅·아이언·정지 3종 자세 시퀀스 fixture 비교."
  - id: HC-AISHOT-009
    area: "aishot"
    title: "AiShot 줌·렌즈·정밀 다이얼·카메라 전환"
    user_outcome: "렌즈 배율 탭·바 드래그·정밀 다이얼로 줌을 조절하고 전/후면을 전환하며, 저장 중에도 설정 조작이 가능하다."
    invariants:
      - "표시 렌즈 배율 후보 [0.5,1,2,4,8]을 기기 지원 범위(±0.05)로 필터. 표시 배율 = 원시 zoom × displayZoomMultiplier(iOS18은 시스템 값, 이하는 wide 전환 계수 역수)."
      - "바/다이얼 드래그: 왼쪽 92pt당 배율 2배(octave), 기기 min/max clamp. 탭은 최근접 배율 선택. 다이얼은 0.5초 무조작 후 자동 닫힘. 다이얼 표시는 배율 x값 + 초점거리(0.75 미만 '13 MM', 4 이상 ×24 후 10 반올림, 그 외 ×24)."
      - "카메라 전환: 후면↔전면. 전환 중 버튼·줌 바 비활성. 트리거 후 저장이 진행 중이면 저장을 끊지 않고 완료 후 전환. 전환·줌 변경 시 시각 분석 리셋, 전환 후 기본 표시 배율 1로 재설정."
      - "저장 중에도 zoom/감도/카메라 설정은 동작해야 하며 저장 progress는 별도 overlay(REF-AISHOT §동작)."
      - "카메라 전환 시 줌 다이얼 닫힘."
    states: "바 표시/다이얼 확장/전환 중/줌 오류"
    errors: "'줌 조절 불가', '카메라 전환 불가', '카메라 사용 불가'"
    cancellation: "다이얼 자동 닫힘"
    data_contract: "줌·카메라는 세션 수명(영속 없음). 기본 후면·표시 1x."
    permissions_security: "해당 없음"
    gestures: "탭/드래그/다이얼 드래그"
    accessibility: "배율 라벨 'nx 확대'+힌트, 다이얼 '정밀 확대 조절' adjustable(±10%), 카메라 전환 라벨/값/힌트"
    device_adaptation: "92pt octave 감도는 dp 환산 동일 체감으로(적응 허용). 배율 의미·clamp·세션 수명 불변."
    ios_evidence:
      - "HanClip/Services/AiShotCamera.swift:479-649 (바·라벨), 1651-1857 (다이얼), 2220-2273 (switch·setZoom), 2447-2563 (기본 줌·배율 계산), 2225-2245 (저장 중 전환 지연)"
    android_acceptance: "표시 배율 목록·drag 감도 체감·전환 중 저장 보존이 동일."
    verification: "저장 진행 중 전환 눌러 클립 무손상 확인."
  - id: HC-AISHOT-010
    area: "aishot"
    title: "AiShot 상태 UI·인터럽션·백그라운드 복구"
    user_outcome: "상태 배지·사운드 미터·스윙 애니메이션으로 진행을 알 수 있고, 전화·백그라운드 후 자동으로 감지가 재개된다."
    invariants:
      - "phase 표기: '감지 중'(ready 전 amber rgb(0.95,0.70,0.24)/ready green rgb(0.31,0.82,0.54)), '감지 됨'(green), '저장 중'(danger rgb(0.88,0.32,0.34))."
      - "진입 시 인트로 스윙 애니메이션을 현재 프리셋 전체 길이만큼 표시. 촬영 확정 시 스윙 스프라이트(36프레임 6열, 30fps 보간, 마감 hold min(0.3초, 20%))를 캡처 길이에 맞춰 재생."
      - "captureRingProgress: 트리거 중 saveProgress×saveWeight, 저장 완료 후 준비 진행이 (1−saveWeight) 구간을 채움. ready+무저장이면 1."
      - "세션 인터럽션 시: 분석 중단, 진행 중 녹화 결과 폐기(discardNextRecordingResult), UI '준비 중' 리셋. 인터럽션 종료 시 세션 재시작+새 녹화."
      - "런타임 오류는 즉시 복구 사이클(begin+finish)."
      - "앱이 비활성화되면 AiShot cover를 닫고 재시작 보류로 표시, 활성 복귀 시 120ms 뒤 조건(활성·보류·cover 닫힘·프로젝트 열림) 재확인 후 cover 재표시. 이 흐름에서 빈 프로젝트 삭제는 건너뛴다."
      - "화면 꺼짐 방지 상태는 AiShot 표시 여부에 연동(updateIdleTimerState)."
    states: "인트로/감지 중(준비·ready)/감지 됨/저장 중/인터럽션/복구/재시작 보류"
