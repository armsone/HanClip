  - id: HC-ROOT-001
    area: "app-shell"
    title: "루트 상태 머신과 전역 overlay"
    user_outcome: "앱은 항상 홈 또는 편집 중 하나의 루트 상태에 있고, 진행·확인·오류 overlay가 그 위에 겹친다."
    invariants:
      - "isProjectOpen=false면 홈, true면 편집. 화면 전환 경로는 REF-SCREENMAP §A/§B 표의 30개 항목 전수와 동일해야 한다."
      - "전역 busy overlay 조건: export, 프로젝트 load, 사진 import, 공유 import, 달력 load/import."
      - "취소 버튼은 작업별 취소 메서드가 존재할 때만 표시한다."
    states: "홈(프로젝트 0/있음, 컬렉션 0/있음, 공유 배너, 테마 notice) / 편집(설정 접힘·펼침) / 진행 overlay / 확인 패널 / 전역 오류 alert"
    errors: "exporter 오류 등은 alertMessage 전역 alert 하나로 수렴. 고정 문구를 임의 생성하지 않는다."
    cancellation: "작업 취소는 task cancel + 가능한 경우 import rollback."
    data_contract: "REF-DATA §2 수명 계층(화면 세션/앱 환경설정/프로젝트/컬렉션/registry)을 따른다."
    permissions_security: "해당 화면 없음. 권한은 각 기능 계약 참조."
    gestures: "REF-SCREENMAP §C 홈 세부 전환(로고 탭/롱터치 0.6s, i 탭/0.55s 롱터치) 그대로."
    accessibility: "REF-DESIGN §9 공통 규칙(최소 터치 타깃, 라벨/힌트) 준수."
