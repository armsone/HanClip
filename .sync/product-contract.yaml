    cancellation: "닫기 시 notice·다이얼 태스크 취소 + camera.cancel"
    data_contract: "phase는 세션 수명(매 세션 감지 중 시작)"
    permissions_security: "해당 없음"
    gestures: "해당 없음"
    accessibility: "저장 progress 라벨 'AiShot 클립 저장 중' + % 값. 스프라이트는 장식(hidden)."
    device_adaptation: "lifecycle 매핑은 Android 관용(ON_STOP/ON_START)으로, 120ms 재시작 의미는 유지(적응 허용)."
    ios_evidence:
      - "HanClip/Services/AiShotCamera.swift:754-770 (색), 1034-1186 (ring·미터), 1189-1267 (스프라이트), 2148-2199 (인터럽션 복구)"
