  - id: HC-AISHOT-004
    area: "aishot"
    title: "AiShot 오디오 임팩트 분류기 (감도 4종·자동 감도·말소리 배제)"
    user_outcome: "타구음 같은 날카로운 충격음만 감지되고 준비 음성·말소리에는 반응하지 않는다."
    invariants:
      - "감도: 시끄러움/일반/조용함/자동. @AppStorage 'hanClipAiShotSensitivity' 앱 전역 영속, 기본 자동. 아이콘 speaker.wave.3/2/1.fill, wand.and.stars."
      - "자동 감도: baseline≥0.026→시끄러움, ≤0.009→조용함, 그 외 일반."
      - "프레임 지표: rms/peak/crossingRate → impactScore(HC-ANALYZE-001 공식과 동일)."
      - "referenceLevel = max(0.003, max(baseline, 직전 recentLevel×0.82)); suddenRise = score/referenceLevel; crestFactor = peak/max(0.001, rms)."
      - "판정: 강한 임팩트와 원거리 날카로운 임팩트 두 경로 OR. 임계값 표(감도별 14개 상수)는 소스 값 그대로 — 시끄러움: strong(scoreFloor .10, baseline×2.7, peakFloor .18, peak baseline×4.2, rise 2.2, cr .07, crest 2.3) / distant(.065, ×3.4, .12, ×5.0, 3.0, .10, 3.5); 일반·자동: strong(.075, ×2.3, .13, ×3.5, 1.8, .05, 2.0) / distant(.045, ×2.8, .09, ×4.2, 2.4, .08, 3.0); 조용함: strong(.055, ×1.9, .095, ×3.0, 1.55, .04, 1.7) / distant(.035, ×2.3, .07, ×3.4, 2.0, .065, 2.5)."
      - "말소리 배제: rms≥0.025 & crest<3.15 & cr<0.16 & rise<4.8 & score<0.18이면 트리거·confidence 0."
      - "confidence = scoreRatio×0.28 + peakRatio×0.22 + riseRatio×0.24 + min(crossingRatio,1.8)×0.13 + min(crestRatio,1.8)×0.13 (distant 임계 기준 비율)."
      - "세션 baseline EMA: ready 전 가중 0.04, 이후 0.012. 샘플 상한 max(0.004, baseline×1.35), 기여 하한 0.002. recentLevel 0.72/0.28. 초기값 둘 다 0.008."
      - "사운드 미터 표시값 = clamp(score×4.5, 0.04…1)."
