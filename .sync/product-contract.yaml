    description: "무음 퍼팅 안전망의 실제 퍼팅 정확도 — 학습 샘플이 풀스윙 중심이라 미검증. 대표 퍼팅 클립 확보 전까지 '안전망 설계 상태'로 유지(README·0.6.0 정의)."
