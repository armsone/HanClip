  - id: HC-ANALYZE-001
    area: "media-analysis"
    title: "클립 소리 분석: waveform과 하이라이트 순위"
    user_outcome: "영상 클립의 좋은 순간이 waveform 위 peak 후보로 최대 12개 제시된다."
    invariants:
      - "192 bucket, 16bit PCM으로 rms/peak/crossingRate 집계. impactScore = min(1, rms×0.55 + peak×0.45 + min(1,cr×10)×rms×0.35)."
      - "rankedImpactTimes: baseline EMA 0.985/0.015(샘플 상한 max(0.004, baseline×1.35), 하한 0.002), recentLevel 0.72/0.28. 결합점수 = confidence + localContrast×0.45 + generalHighlight×0.75 + memorableMoment×0.58 + score×0.12."
      - "후보 채택: 트리거됨 또는 highlight>0.82 또는 memorable>0.78 또는 결합>1.02. 없으면 전 프레임 fallback."
      - "최소 간격 max(0.45초, duration/160), 상한 12개."
      - "memorableMomentScore는 가장자리 신뢰도 min(1, 가장자리거리/6)를 곱해 영상 시작·끝 착시를 낮춘다. usesAudibleResponseWeight(0.2.0+)이면 이후 반응 에너지 min(1, afterEnergy/0.045)로 지속 반응 보너스를 가중."
    states: "해당 없음(순수 함수)"
    errors: "트랙 없음/무음은 HC-ANALYZE-002로 위임"
