  - id: HC-AISHOT-003
    area: "aishot"
    title: "AiShot 링버퍼 녹화·시간 프리셋·촬영 타이밍·트리밍"
    user_outcome: "임팩트 전후가 포함된 클립(짧게 3초/일반 5초/길게 10초)이 자동으로 잘려 저장된다."
    invariants:
      - "시간 프리셋: 짧게 앞1.5/뒤1.5, 일반 앞2/뒤3, 길게 앞5/뒤5. saveProgressWeight = 뒤/전체."
      - "프리셋 순환: 일반→(짧게/길게 교대)→일반. 다음 edge 방향도 저장한다. 선택·방향은 projectId 범위 UserDefaults 키 'hanClipAiShotDurationPreset.<uuid>' / 'hanClipAiShotDurationDirection.<uuid>'에 영속(프로젝트 없으면 비영속, 기본 일반/길게)."
      - "변경 시 1.7초 notice 패널(앞 n초 · 뒤 n초, 총 n초)."
      - "녹화는 상시 진행: 임시 UUID.mov에 기록, 트리거 시각은 monotonic clock(CACurrentMediaTime) 경과초."
      - "ready 조건: 경과 ≥ beforeShot. 그 전에는 preparationProgress=경과/beforeShot, 수동 촬영 불가."
      - "트리거 시: didRequestStop, afterShot 초 후 녹화 중지 예약, afterShot+4초 watchdog이 미중지 시 세션 복구 강제. UI는 감지 됨→0.6초 후 저장 중, saveProgress는 afterShot 동안 선형."
      - "트리밍: start=max(0, trigger−before), end=min(파일길이, trigger+after). end−start<0.5초면 invalidTimeRange 오류. 1080×1440 aspect-fill, 30fps, timescale 600, 최고 화질, .mov. 결과 triggerTime은 trigger−start."
      - "트리밍 성공 시 원본 임시 파일 삭제 후 completedCapture 발행. 실패 시 파일 삭제 + '저장 불가'."
      - "녹화 종료 0.35초 후 자동으로 다음 녹화 시작(연속 촬영). 카메라 전환 대기 중이면 전환 먼저."
      - "촬영 확정 시 사용한 프리셋(activeDurationPreset)이 그 캡처의 트리밍에 쓰인다(도중 프리셋 변경 무영향)."
    states: "감지 중(준비/ready) → 감지 됨 → 저장 중 → 완료 → 다음 감지. 인터럽션/복구는 HC-AISHOT-008."
    errors: "invalidTimeRange/cannotCreateExporter/videoTrackUnavailable/exportFailed → 파일 정리 + '저장 불가'. 녹화 오류 시 결과 폐기 후 재시작."
    cancellation: "닫기 시 진행 중 녹화 중지, 임시 파일은 delegate에서 삭제."
    data_contract: "REF-DATA §9 (trigger monotonic time, requested pre/post, actual duration, 내부 URI)."
    permissions_security: "해당 없음"
    gestures: "시간 패널 탭 순환"
    accessibility: "시간 패널 값 '<제목>, 앞 n초, 뒤 n초', 힌트 '누를 때마다 짧게, 일반, 길게 순서로 변경됩니다'. 저장 progress 접근성 % 값."
    device_adaptation: "링버퍼 구현(연속 녹화+후단 트림)은 재량이되 전/후 초·최소 0.5초·1080×1440·monotonic clock 사용은 불변(적응 허용)."
    ios_evidence:
      - "HanClip/Services/AiShotCamera.swift:71-118 (프리셋), 120-165·971-1032 (영속 키·순환), 2565-2600 (startRecording), 3359-3398 (requestStopAfterTrigger·watchdog), 3413-3535 (trimCapture·aspectFill), 3554-3635 (delegate·0.35s 재시작)"
    android_acceptance: "세 프리셋의 실제 클립 길이(±0.2초), 트리거 상대 위치, 연속 촬영 재개, watchdog 복구가 동일."
