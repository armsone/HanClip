  - id: HC-AISHOT-006
    area: "aishot"
    title: "AiShot 신체 자세 분석 (Vision, Ai 0.5.0/0.5.1)"
    user_outcome: "기기 안에서만 골퍼의 관절 흐름을 낮은 빈도로 확인해 스윙 근거를 보강하고, 확신이 없으면 촬영을 막지 않고 0.4.0 경로로 복귀한다."
    invariants:
      - "분석 주기 0.20초(저전력 0.33, 발열 serious 0.40, critical이면 중단). 결과 유효 시한 0.65초. 동시 요청 1개."
      - "후보 유효성: 어깨·골반 합 3점 이상(각 최소 1), bodyScale(어깨-골반 거리)≥0.04, observation confidence≥0.50. 손은 양 손목 평균, 한 손목만 있으면 conf≥0.55+같은 팔꿈치 conf≥0.40 필요."
      - "손 좌표는 골반 중심·몸축 기준 상대축(lateral/axis)을 bodyScale로 정규화 — 좌타·우타·전면 미러 공통."
      - "다인 판별: 이전 target 있으면 거리 최소 후보(거리≤0.65, 2위와 차≥0.25 아니면 무효). 없으면 점수(conf×0.52+min(1,scale×3.2)×0.33+중심 근접×0.15) 1위, 2위와 차<0.08이면 무효 — 애매하면 자세 판단 포기."
      - "샘플 conf<0.45·scale<0.04는 무시. 샘플 간격>0.6초 또는 scale 변화>25%면 분석기 리셋."
      - "자세 미검출 0.35초 지속 시 자세 분석기·신호 리셋(0.60초 지속 시 target도 해제)하고, 보류 중 임팩트가 0.42초 이내면 자세 없이 융합 재시도(자세가 촬영을 막지 않음)."
      - "스윙 자세 상태기계: 정지(손속도≤0.22·몸통속도≤0.20, 0.55초·3샘플)→주소; 변위≥0.20→백스윙(방향 고정); 경과≥0.18 & peak≥0.28 & 복귀속도≥0.55 2샘플 & 복귀량≥max(0.18, peak×0.55)→임팩트 창 [감지−0.45초, 감지+0.30초]; 백스윙 1.8초 초과 리셋."
      - "임팩트 창 confidence = min(관측 conf, min(1, 0.72+peak×0.45))."
